<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0; --surface: #ffffff; --surface-2: #fafaf7;
  --border: #e7e4dd; --border-strong: #d6d2c8;
  --text: #1a1814; --text-2: #4a463f; --muted: #87807a;
  --accent: #0d6b62; --accent-soft: #d6efea; --accent-tint: #ecf7f5;
  --green: #0f7a52; --green-soft: #e3f1eb;
  --red: #b3341f; --red-soft: #f6e3df;
  --amber: #b07a13; --amber-soft: #f5ead0;
  --blue: #2554a8; --blue-soft: #e1e9f5;
  --purple: #6b46c1; --purple-soft: #ece4f7;
  --r-card: 16px; --r-pill: 999px;
  --shadow-sm: 0 1px 2px rgba(40,32,16,0.04);
  --shadow-md: 0 2px 8px rgba(40,32,16,0.06), 0 1px 2px rgba(40,32,16,0.03);
  --shadow-lg: 0 4px 16px rgba(40,32,16,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.hub-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  max-width: 1100px; margin: 0 auto; padding: 20px 24px;
}
.hub-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; letter-spacing: -0.01em; }
.hub-brand .dot { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 0.875rem; }
.hub-user { display: flex; align-items: center; gap: 10px; font-size: 0.8125rem; color: var(--text-2); }
.hub-user a { text-decoration: none; padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--surface); }
.hub-user a:hover { border-color: var(--border-strong); color: var(--text); }
main.hub { max-width: 1100px; margin: 0 auto; padding: 12px 24px 64px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow-sm); }
.btn {
  all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 20px; border-radius: var(--r-pill); font-weight: 600; font-size: 0.875rem;
  background: var(--text); color: #fff; transition: background .2s;
}
.btn:hover { background: #000; }
.btn[disabled] { opacity: .5; cursor: progress; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn.ghost:hover { border-color: var(--border-strong); background: var(--surface-2); }
.btn.small { padding: 7px 14px; font-size: 0.8125rem; }
input.field {
  width: 100%; font: inherit; font-size: 0.9375rem; padding: 12px 16px;
  border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); color: var(--text); outline: none;
}
input.field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.alert { padding: 10px 14px; border-radius: 10px; font-size: 0.875rem; line-height: 1.45; }
.alert.error { background: var(--red-soft); color: var(--red); }
.alert.info { background: var(--blue-soft); color: var(--blue); }
.muted { color: var(--muted); }
[hidden] { display: none !important; }
</style>
